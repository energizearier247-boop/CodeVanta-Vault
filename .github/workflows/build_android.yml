
name: Build CodeVanta Vault Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.codevanta .
          fi

      - name: Set app compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          app_gradle = next(
              (p for p in candidates if p.exists()), None
          )

          if app_gradle is None:
              raise SystemExit(
                  "Could not find Android app Gradle file"
              )

          content = app_gradle.read_text()

          updated, count = re.subn(
              r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)([^\n]+)$",
              r"\g<1>36",
              content,
          )

          if count == 0:
              raise SystemExit(
                  "Could not find compileSdk in " + str(app_gradle)
              )

          app_gradle.write_text(updated)
          print("App compileSdk set to 36")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Check Dart code
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeVanta-Vault-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
