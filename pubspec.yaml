name: codevanta_vault
description: A private, offline-first encrypted file vault by CodeVanta.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  just_audio: ^0.10.4
  video_player: ^2.10.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/codevanta_vault_icon.png
  adaptive_icon_background: "#071326"
  adaptive_icon_foreground: assets/icon/codevanta_vault_icon.png
